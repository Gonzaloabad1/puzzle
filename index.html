<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Mamá! - El Puzzle</title>
    <link rel="stylesheet" href="puzzle.css">
</head>
<body>
    <div class="game-container">
        <h1 class="title">Ordena las piezas haciendo clic en dos de ellas</h1>
        <div id="puzzle-board"></div>
        <button id="shuffle-btn">Mezclar y Reiniciar</button>
    </div>

    <div id="victory-screen" class="hidden">
        <div class="message-box">
            <h2>¡COMPLETADO!</h2>
            <h1>¡FELIZ CUMPLEAÑOS MAMÁ! 🎂🎉</h1>
            <p>¡Has ordenado la foto perfectamente!</p>
            <button onclick="restartGame()">Jugar de nuevo</button>
        </div>
    </div>

    <script src="puzzle.js"></script>
</body>
</html>
